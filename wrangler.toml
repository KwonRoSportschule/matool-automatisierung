name = "matool-middleware-hub"
main = "src/worker.js"
compatibility_date = "2026-07-28"

[triggers]
crons = ["0 6-19 * * MON-FRI"]

# Add production namespace IDs outside source control before deployment.
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"
